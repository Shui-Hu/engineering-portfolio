<g font-family="Microsoft YaHei, sans-serif" fill="#647e73" font-size="14"><text x="42" y="457">实线：正常工作路径　虚线：一键恢复的桌面交接</text><text x="42" y="482">桌面归档并释放占用后，由管理后台恢复、接管同一个会话 ID。</text></g>
